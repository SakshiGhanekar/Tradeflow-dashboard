<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trades Dashboard</title>
    <style>
      :root {
        --bg: #020c17;
        --panel: rgba(19, 29, 38, 0.9);
        --panel-2: rgba(18, 25, 33, 0.9);
        --header: rgba(18, 26, 34, 0.95);
        --line: rgba(255, 255, 255, 0.08);
        --text: #f4f7fb;
        --muted: #b9c5d3;
        --soft: #b0c0d4;
        --blue: #7b8eff;
        --blue-strong: #5f7af8;
        --badge: rgba(255, 255, 255, 0.08);
        --warning: #f0b94b;
        --danger: #ff8a80;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        padding: 20px 28px;
      }

      main {
        max-width: 1200px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
      }

      .status-pill.warning {
        color: var(--warning);
      }

      .status-pill.success {
        color: #8ad9a4;
      }

      .pull-btn {
        border: 0;
        border-radius: 10px;
        background: linear-gradient(180deg, #7d8ef7, #5d71eb);
        color: white;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(93, 113, 235, 0.28);
      }

      .pull-btn:disabled {
        opacity: 0.7;
        cursor: default;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(200px, 1fr));
        gap: 14px;
        margin-top: 26px;
      }

      .stat-card {
        background: rgba(35, 46, 58, 0.82);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 18px 12px;
        min-height: 108px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .stat-label {
        color: var(--soft);
        font-size: 14px;
        margin-bottom: 6px;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 700;
        line-height: 1.2;
      }

      .table-wrap {
        margin-top: 24px;
      }

      .table-label {
        display: inline-flex;
        align-items: center;
        padding: 10px 16px 9px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: #ebeff7;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border: 1px solid var(--line);
      }

      .table-label::before {
        content: 'D';
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        margin-right: 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.08);
        color: #111827;
      }

      table {
        width: 100%;
        margin-top: 16px;
        border-collapse: collapse;
        background: rgba(19, 29, 38, 0.8);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      th, td {
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        color: var(--text);
      }

      th {
        font-size: 13px;
        font-weight: 700;
        color: var(--soft);
        background: rgba(255, 255, 255, 0.02);
      }

      td {
        font-size: 13px;
        color: #edf3ff;
      }

      .qty, .price {
        text-align: right;
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .stats {
          grid-template-columns: repeat(2, minmax(200px, 1fr));
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 18px 16px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <h1>Trades Dashboard</h1>

        <div class="top-actions">
          <span id="status" class="status-pill">Pull failed: fetch failed</span>
          <button id="pull" class="pull-btn" type="button">Pull now</button>
        </div>
      </div>

      <section class="stats">
        <div class="stat-card">
          <div class="stat-label">Total trades</div>
          <div id="count" class="stat-value">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Notional (₹)</div>
          <div id="notional" class="stat-value">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Last pull completed</div>
          <div id="last" class="stat-value" style="font-size: 16px; font-weight: 600; color: var(--muted);">No completed pull yet</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Notional by symbol</div>
          <div id="bars" class="stat-value" style="font-size: 13px; font-weight: 600; color: var(--muted);">—</div>
        </div>
      </section>

      <div class="table-wrap">
        <div class="table-label">D Y PATIL UNIVERSITY</div>

        <table>
          <thead>
            <tr>
              <th>Trade ID</th>
              <th>Client</th>
              <th>Symbol</th>
              <th class="qty">Qty</th>
              <th class="price">Price</th>
              <th>Time (UTC)</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <script>
      const statusEl = document.getElementById('status');
      const countEl = document.getElementById('count');
      const notionalEl = document.getElementById('notional');
      const lastEl = document.getElementById('last');
      const barsEl = document.getElementById('bars');
      const rowsEl = document.getElementById('rows');
      const pullBtn = document.getElementById('pull');

      let seen = new Set();
      let isFirstLoad = true;
      let debounceTimer;

      const formatNumber = (value) => Number(value).toLocaleString('en-IN');

      function updateStatus(payload) {
        const state = payload.state;

        if (state === 'pulling') {
          statusEl.textContent = 'Pull in progress';
          statusEl.className = 'status-pill warning';
        } else if (state === 'error') {
          statusEl.textContent = `Pull failed: ${payload.error || 'fetch failed'}`;
          statusEl.className = 'status-pill warning';
        } else {
          statusEl.textContent = 'Up to date';
          statusEl.className = 'status-pill success';
        }

        pullBtn.disabled = state === 'pulling';
        lastEl.textContent = payload.lastPullAt ? new Date(payload.lastPullAt).toLocaleString() : 'No completed pull yet';
      }

      async function loadTrades() {
        try {
          const [tradeResult, summaryResult] = await Promise.all([
            fetch('/api/trades?limit=200').then((res) => res.json()),
            fetch('/api/summary').then((res) => res.json())
          ]);

          rowsEl.innerHTML = tradeResult.trades
            .map((trade) => {
              const isNew = !isFirstLoad && !seen.has(trade.tradeId);
              return `
                <tr class="${isNew ? 'new-row' : ''}">
                  <td>${trade.tradeId}</td>
                  <td>${trade.client}</td>
                  <td>${trade.symbol}</td>
                  <td class="qty">${trade.quantity}</td>
                  <td class="price">${trade.price.toFixed(2)}</td>
                  <td>${trade.timestamp.replace('T', ' ').slice(0, 19)}</td>
                </tr>
              `;
            })
            .join('');

          tradeResult.trades.forEach((trade) => seen.add(trade.tradeId));
          isFirstLoad = false;

          countEl.textContent = formatNumber(summaryResult.count);
          notionalEl.textContent = formatNumber(Math.round(summaryResult.notional));

          const entries = Object.entries(summaryResult.bySymbol || {})
            .sort(([, a], [, b]) => b - a)
            .slice(0, 4);

          if (entries.length) {
            const maxValue = Math.max(...entries.map(([, value]) => value), 1);
            barsEl.innerHTML = entries
              .map(([symbol, value]) => `
                <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
                  <span style="min-width:54px; font-weight:700; color:#cfe0ff;">${symbol}</span>
                  <span style="display:inline-block; width:100%; max-width:140px; height:8px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden;">
                    <span style="display:block; height:100%; width:${(value / maxValue) * 100}%; background:linear-gradient(90deg,#7d8ef7,#87c7ff); border-radius:999px;"></span>
                  </span>
                </div>
              `)
              .join('');
          } else {
            barsEl.textContent = '—';
          }
        } catch (error) {
          console.error('Load error:', error);
        }
      }

      const eventSource = new EventSource('/api/events');

      eventSource.addEventListener('status', (event) => {
        updateStatus(JSON.parse(event.data));
      });

      eventSource.addEventListener('pull-complete', (event) => {
        const payload = JSON.parse(event.data);
        updateStatus(payload);
        loadTrades();
      });

      pullBtn.addEventListener('click', () => {
        fetch('/api/pull', { method: 'POST' });
      });

      loadTrades();
    </script>
  </body>
</html>
